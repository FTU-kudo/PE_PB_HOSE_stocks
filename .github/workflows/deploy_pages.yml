name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'  # Chỉ chạy khi có thay đổi trong thư mục docs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Tăng timeout của job lên 30 phút
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs' # Deploy thư mục docs
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # Tăng timeout của step deploy lên 30 phút (tính bằng milliseconds)
