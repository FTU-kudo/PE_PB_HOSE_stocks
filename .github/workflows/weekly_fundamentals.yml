name: 🔄 Weekly Fundamentals Refresh

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (optional)'
        required: false
        default: 'Manual refresh'

jobs:
  refresh-fundamentals:
    name: Fetch EPS & BVPS for all HOSE tickers
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Diagnose environment
        run: |
          echo "=== Python & vnstock ==="
          python --version
          pip show vnstock | grep -E "Name|Version" || echo "vnstock not found"

          echo "=== vnstock imports ==="
          python -c "
          for cls in ['Reference', 'Fundamental', 'Trading']:
              try:
                  exec(f'from vnstock import {cls}; print(f\"  {cls} OK\")')
              except Exception as e:
                  print(f'  {cls} FAILED: {e}')
          "

          echo "=== Test ratio() column format ==="
          python -c "
          import sys; sys.path.insert(0, '.')
          try:
              from vnstock import Fundamental
              df = Fundamental().equity('VCB').ratio(lang='en')
              print(f'  ratio() columns: {list(df.columns)}')
              print(f'  Sample period: {df[\"period\"].iloc[0] if \"period\" in df.columns else \"N/A\"}')
              print(f'  trailing_eps present: {\"trailing_eps\" in df.columns}')
              print(f'  book_value_per_share present: {\"book_value_per_share\" in df.columns}')
          except Exception as e:
              print(f'  ratio() test FAILED: {e}')
          "

          echo "=== scripts.config import ==="
          python -c "
          import sys; sys.path.insert(0, '.')
          from scripts.config import EXCHANGE, FUND_BATCH_SLEEP, FUND_BATCH_EVERY
          print(f'  OK — EXCHANGE={EXCHANGE}, sleep={FUND_BATCH_SLEEP}s, every={FUND_BATCH_EVERY}')
          " || echo "  scripts.config FAILED"

      - name: Fetch TTM EPS & BVPS for all HOSE tickers
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/fetch_fundamentals.py

      - name: Commit and push fundamentals cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/fundamentals.parquet
          if git diff --staged --quiet; then
            echo "No changes in fundamentals."
          else
            DATE=$(date -u '+%Y-%m-%d')
            COUNT=$(python -c "import pandas as pd; df=pd.read_parquet('data/fundamentals.parquet'); print(len(df))")
            git commit -m "🔄 Weekly fundamentals refresh ${DATE} (${COUNT} tickers) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed. Waiting 10s..."
              sleep 10
            done
          fi

      - name: Write job summary
        if: always()
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          echo "### 🔄 Weekly Fundamentals — ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 scripts/generate_summary.py >> $GITHUB_STEP_SUMMARY \
            || echo "⚠️ data/fundamentals.parquet not found." >> $GITHUB_STEP_SUMMARY
